# Reads the live bin requests from loftiacodex.com with a real browser and saves them to data/requests-live.json.
# The website's "Update requests" button uses this file first. Runs every 4 hours, or on demand from the Actions tab.
name: Update bin requests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: write

concurrency:
  group: update-bins
  cancel-in-progress: false

jobs:
  read-bins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Read the bin pages
        run: node tools/read-bins.mjs
      - name: Save to the repository
        if: success()
        run: |
          if [ ! -f data/requests-live.json ]; then echo "Nothing was saved this time."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/requests-live.json
          if git diff --cached --quiet; then
            echo "Bin requests unchanged."
            exit 0
          fi
          git commit -m "Update bin requests from loftiacodex.com"
          git pull --rebase --autostash || true
          if ! git push; then
            echo "::error::GitHub didn't allow the action to save. Open Settings > Actions > General, choose 'Read and write permissions' under Workflow permissions, click Save, then run this again."
            exit 1
          fi
