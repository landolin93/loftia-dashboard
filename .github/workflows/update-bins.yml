# Reads the live bin requests (today + 6 days) for the nine codex bins and saves them to data/requests-live.json.
# Pages and the codex's own scripts are downloaded the plain way (like the picture saver), then run in a browser
# on GitHub's machine that never contacts the codex itself. The website's "Update requests" button uses this file.
# Runs every 4 hours, or on demand from the Actions tab.
name: Update bin requests

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

permissions:
  contents: write

concurrency:
  group: update-bins
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'   # show progress lines in the log as they happen

jobs:
  read-bins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install a browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Read the bin pages
        run: python tools/read_bins.py
      - name: Save to the repository
        run: |
          if [ ! -f data/requests-live.json ]; then echo "Nothing was saved this time."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/requests-live.json
          if git diff --cached --quiet; then
            echo "Bin requests unchanged."
            exit 0
          fi
          git commit -m "Update bin requests from loftiacodex.com"
          git pull --rebase --autostash || true
          if ! git push; then
            echo "::error::GitHub didn't allow the action to save. Open Settings > Actions > General, choose 'Read and write permissions' under Workflow permissions, click Save, then run this again."
            exit 1
          fi
