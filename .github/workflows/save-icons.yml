# Saves every item picture from loftiacodex.com into the icons/ folder of this repository.
# Run it from the Actions tab ("Save item pictures" -> "Run workflow"). It also runs every Monday
# to pick up pictures for new items. Pictures you already have are never downloaded again.
name: Save item pictures

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  save-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download missing pictures
        run: node tools/save-icons.mjs
      - name: Save them to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add icons
          if git diff --cached --quiet; then
            echo "No new pictures."
          else
            git commit -m "Save item pictures from loftiacodex.com"
            git push
          fi
